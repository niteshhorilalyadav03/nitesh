    <script>
      // Suppress unhandled WebSocket / Vite HMR connection errors in iframe environment
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
            event.message.includes('@vite/client') ||
            event.message.includes('createWebSocketModuleRunnerTransport'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason ? String(event.reason) : '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          reason.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
